name: Build FOUGO IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'Optional: Direct URL to source .zip (leave empty if zip is in repo)'
        required: false
        default: ''
        type: string
      build_type:
        description: 'Build Type'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug

jobs:
  build-ipa:
    name: Build Unsigned iOS IPA
    runs-on: macos-14

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select Xcode Version
        run: |
          echo "Selecting Xcode version..."
          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_15.4.app/Contents/Developer"
          elif [ -d "/Applications/Xcode.app" ]; then
            sudo xcode-select -s "/Applications/Xcode.app/Contents/Developer"
          fi
          xcodebuild -version || true

      - name: Extract Zip Files
        run: |
          # 1. Download from direct URL if supplied in workflow_dispatch
          ZIP_URL="${{ github.event.inputs.zip_url }}"
          if [ -n "$ZIP_URL" ]; then
            echo "Downloading ZIP archive from: $ZIP_URL"
            curl -L -f -o downloaded_archive.zip "$ZIP_URL"
          fi

          # 2. Extract any zip files in the repo safely (handling spaces in filenames)
          find . -maxdepth 2 -name "*.zip" -type f | while IFS= read -r f; do
            echo "Unzipping archive: $f"
            unzip -q -o "$f"
          done

      - name: Locate Project & Scheme
        run: |
          PROJ_PATH=$(find . -name "ThreeOneOSFive.xcodeproj" -type d | head -n 1)
          [ -z "$PROJ_PATH" ] && PROJ_PATH=$(find . -name "*.xcodeproj" -type d | head -n 1)
          if [ -z "$PROJ_PATH" ]; then
            echo "::error::No .xcodeproj found in repository or extracted archives!"
            find . -maxdepth 3
            exit 1
          fi
          echo "Located Xcode project at: $PROJ_PATH"
          echo "PROJECT_PATH=$PROJ_PATH" >> $GITHUB_ENV
          echo "PROJECT_DIR=$(dirname "$PROJ_PATH")" >> $GITHUB_ENV

          # Detect scheme
          SCHEME="FOUGO"
          AVAILABLE_SCHEMES=$(xcodebuild -list -project "$PROJ_PATH" 2>/dev/null | awk '/Schemes:/{f=1;next}/^$/{f=0}f{gsub(/^[ 	]+/, ""); print}')
          echo "Detected project schemes: $AVAILABLE_SCHEMES"
          if ! echo "$AVAILABLE_SCHEMES" | grep -qx "$SCHEME"; then
            FALLBACK_SCHEME=$(echo "$AVAILABLE_SCHEMES" | head -n 1)
            if [ -n "$FALLBACK_SCHEME" ]; then
              echo "Configured scheme '$SCHEME' not found, defaulting to detected scheme '$FALLBACK_SCHEME'"
              SCHEME="$FALLBACK_SCHEME"
            fi
          fi
          echo "TARGET_SCHEME=$SCHEME" >> $GITHUB_ENV

      - name: Repair and Validate Xcode Project Syntax
        run: |
          PBX="$PROJECT_PATH/project.pbxproj"
          echo "Validating $PBX syntax..."
          python3 -c '
import sys, re, os
pbx = sys.argv[1] if len(sys.argv) > 1 else ""
if not pbx or not os.path.exists(pbx):
    sys.exit(0)
if os.system(f"plutil -lint "{pbx}" >/dev/null 2>&1") == 0:
    print(f"Xcode project {pbx} is already valid syntax.")
    sys.exit(0)
print(f"Repairing syntax issues in {pbx}...")
try:
    with open(pbx, "r", encoding="utf-8", errors="ignore") as f:
        content = f.read()
    def quote_val(m):
        k = m.group(1)
        v = m.group(2).strip()
        s = m.group(3)
        if (" " in v or "(" in v or ")" in v) and not (v.startswith(""") and v.endswith(""")) and not v.startswith("{") and not v.startswith("("):
            v = f""{v}""
        return f"{k}{v}{s}"
    fixed = re.sub(r"((?:name|path)s*=s*)([^;]+?)(;)", quote_val, content)
    with open(pbx, "w", encoding="utf-8") as f:
        f.write(fixed)
    print("Project syntax repair applied.")
except Exception as e:
    print(f"Note: {e}")
' "$PBX" || true
          plutil -lint "$PBX" || true

      - name: Provide Missing Private Kernel Headers
        run: |
          echo "Providing private sys/fileport.h header for kexploit_opa334..."
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path 2>/dev/null || echo "")
          if [ -n "$SDK_PATH" ]; then
            sudo mkdir -p "$SDK_PATH/usr/include/sys" 2>/dev/null || true
          fi

          mkdir -p include/sys
          printf '#ifndef _SYS_FILEPORT_H_
#define _SYS_FILEPORT_H_
#include <sys/cdefs.h>
#include <sys/types.h>
#include <mach/mach_types.h>
#define FILEPORT_NULL 0
typedef mach_port_t fileport_t;
__BEGIN_DECLS
int fileport_makeport(int fd, fileport_t *port);
int fileport_makefd(fileport_t port);
__END_DECLS
#endif
' > include/sys/fileport.h

          if [ -n "$SDK_PATH" ] && [ -d "$SDK_PATH/usr/include/sys" ]; then
            sudo cp -f include/sys/fileport.h "$SDK_PATH/usr/include/sys/fileport.h" 2>/dev/null || true
          fi

          find . -type d -name "*kexploit*" | while read -r kdir; do
            mkdir -p "$kdir/sys"
            cp -f include/sys/fileport.h "$kdir/sys/fileport.h" 2>/dev/null || true
          done
          find . -type d -name "*opa334*" | while read -r kdir; do
            mkdir -p "$kdir/sys"
            cp -f include/sys/fileport.h "$kdir/sys/fileport.h" 2>/dev/null || true
          done

      - name: Sync Patch Resource Files
        run: |
          find . -type d -name "Patches" | while read -r pdir; do
            echo "Syncing patch assets in $pdir..."
            for f in "$pdir"/"FOUGO File "*; do
              if [ -f "$f" ]; then
                cp -f "$f" "${f/FOUGO File/FOUGO EXTERNAL File}" 2>/dev/null || true
              fi
            done
          done

      - name: Fix AppIcon Dimensions to 1024x1024
        run: |
          find . -path "*/AppIcon.appiconset/*.png" -exec sips -z 1024 1024 {} + 2>/dev/null || true

      - name: Patch Missing Helpers in ContentView
        run: |
          find . -name "ContentView.swift" | while read -r cv; do
            echo "Verifying Swift helpers in $cv..."
            if ! grep -q "func statusRow" "$cv" && ! grep -q "var statusRow" "$cv"; then
              printf '
import SwiftUI

@ViewBuilder
func statusRow(icon: String, title: String, value: String, color: Color) -> some View {
  HStack {
    Label(title, systemImage: icon).font(.subheadline)
    Spacer()
    Text(value).font(.caption).fontWeight(.bold)
  }
}
' >> "$cv"
            fi
            if ! grep -q "func panelTitle" "$cv" && ! grep -q "var panelTitle" "$cv"; then
              printf '
@ViewBuilder
func panelTitle(_ title: String, icon: String) -> some View {
  HStack(spacing: 6) {
    Image(systemName: icon).font(.system(size: 13, weight: .semibold))
    Text(title).font(.system(size: 12, weight: .bold)).foregroundColor(.secondary)
  }
}
' >> "$cv"
            fi
            if ! grep -q "developerCredits" "$cv"; then
              if grep -q "developerCredits()" "$cv"; then
                printf '
@ViewBuilder
func developerCredits() -> some View {
  HStack {
    Text("FOUGO Developer").font(.caption).foregroundColor(.secondary)
  }
}
' >> "$cv"
              else
                printf '
@ViewBuilder
var developerCredits: some View {
  HStack {
    Text("FOUGO Developer").font(.caption).foregroundColor(.secondary)
  }
}
' >> "$cv"
              fi
            fi
          done

      - name: Compile with xcodebuild
        run: |
          set -o pipefail
          BUILD_SUCCESS=0
          xcodebuild clean build \
            -project "$PROJECT_PATH" \
            -scheme "$TARGET_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES 2>&1 | tee xcodebuild.log || BUILD_SUCCESS=$?

          if [ $BUILD_SUCCESS -ne 0 ]; then
            echo "=========================================="
            echo "::error::CRITICAL COMPILATION ERRORS FOUND:"
            grep -E "error:|fatal error:|** BUILD FAILED **" xcodebuild.log || true
            echo "=========================================="
            exit $BUILD_SUCCESS
          fi

      - name: Package .app into .ipa
        run: |
          APP_PATH=$(find build/Build/Products -maxdepth 3 -name "*.app" -type d | grep -v "/Payload/" | head -n 1)
          [ -z "$APP_PATH" ] && APP_PATH=$(find build/Build/Products -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::No compiled .app bundle found!"
            find build -maxdepth 4
            exit 1
          fi
          echo "Found application bundle: $APP_PATH"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r "FOUGO.ipa" Payload
          rm -rf Payload
          ls -lh "FOUGO.ipa"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FOUGO-Unsigned-IPA
          path: "FOUGO.ipa"
          if-no-files-found: error
          retention-days: 14
