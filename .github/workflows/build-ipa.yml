name: Build FOUGO IPA

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'Optional: Direct URL to source .zip (leave empty if zip is in repo)'
        required: false
        default: ''
        type: string

jobs:
  build-ipa:
    name: Build Unsigned iOS IPA
    runs-on: macos-14

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Extract Zip Files
        run: |
          # 1. Download from direct URL if provided in workflow_dispatch
          ZIP_URL="${{ github.event.inputs.zip_url }}"
          if [ -n "$ZIP_URL" ]; then
            echo "Downloading ZIP archive from: $ZIP_URL"
            curl -L -f -o downloaded_archive.zip "$ZIP_URL"
          fi

          # 2. Extract zip archives safely (handling spaces in filenames)
          find . -maxdepth 2 -name "*.zip" -type f | while IFS= read -r f; do
            echo "Unzipping archive: $f"
            unzip -q -o "$f"
          done

      - name: Locate Project & Scheme
        run: |
          PROJ_PATH=$(find . -name "ThreeOneOSFive.xcodeproj" -type d | head -n 1)
          [ -z "$PROJ_PATH" ] && PROJ_PATH=$(find . -name "*.xcodeproj" -type d | head -n 1)
          if [ -z "$PROJ_PATH" ]; then
            echo "::error::No .xcodeproj found in repository or extracted archives!"
            find . -maxdepth 3
            exit 1
          fi
          echo "Located Xcode project at: $PROJ_PATH"
          echo "PROJECT_PATH=$PROJ_PATH" >> $GITHUB_ENV
          echo "PROJECT_DIR=$(dirname "$PROJ_PATH")" >> $GITHUB_ENV

      - name: Repair and Validate Xcode Project Syntax
        run: |
          PBX="$PROJECT_PATH/project.pbxproj"
          echo "Repairing syntax in $PBX..."
          python3 -c "
          import re, sys
          p = sys.argv[1]
          with open(p, 'r', encoding='utf-8', errors='ignore') as f:
              lines = f.read().splitlines()
          repaired = []
          for line in lines:
              def quote_val(m):
                  k = m.group(1)
                  v = m.group(2).strip()
                  s = m.group(3)
                  if (' ' in v or '(' in v or ')' in v) and not v.startswith('\"'):
                      v = f'\"{v}\"'
                  return f'{k}{v}{s}'
              line = re.sub(r'(\b\w+\s*=\s*)([^\";{}\n]+?)(\s*;|\s*$)', quote_val, line)
              st = line.strip()
              if st and not st.startswith('//') and not st.startswith('/*'):
                  if st.endswith('}') and not st.endswith('};'):
                      line = line + ';'
                  elif '=' in st and not st.endswith(';') and not st.endswith('{'):
                      line = line + ';'
              repaired.append(line)
          with open(p, 'w', encoding='utf-8') as f:
              f.write('\n'.join(repaired) + '\n')
          " "$PBX"
          plutil -lint "$PBX" || true

      - name: Sync Patch Resource Files
        run: |
          find . -type d -name "Patches" | while read -r pdir; do
            echo "Syncing patch assets in $pdir..."
            for f in "$pdir"/"FOUGO File "*; do
              if [ -f "$f" ]; then
                cp -f "$f" "${f/FOUGO File/FOUGO EXTERNAL File}"
              fi
            done
          done

      - name: Fix AppIcon Dimensions to 1024x1024
        run: |
          find . -path "*/AppIcon.appiconset/*.png" -exec sips -z 1024 1024 {} + || true

      - name: Patch Missing Helpers in ContentView
        run: |
          find . -name "ContentView.swift" | while read -r cv; do
            echo "Verifying Swift helpers in $cv..."
            PATCH=""
            if ! grep -q "func statusRow" "$cv" && ! grep -q "var statusRow" "$cv"; then
              PATCH="$PATCH
@ViewBuilder
func statusRow(icon: String, title: String, value: String, color: Color) -> some View {
  HStack {
    Label(title, systemImage: icon).font(.subheadline)
    Spacer()
    Text(value).font(.caption).fontWeight(.bold).foregroundColor(color)
  }
}
"
            fi
            if ! grep -q "func panelTitle" "$cv" && ! grep -q "var panelTitle" "$cv"; then
              PATCH="$PATCH
@ViewBuilder
func panelTitle(_ title: String, icon: String) -> some View {
  HStack(spacing: 6) {
    Image(systemName: icon).font(.system(size: 13, weight: .semibold))
    Text(title).font(.system(size: 12, weight: .bold)).foregroundColor(.secondary)
  }
}
"
            fi
            if ! grep -q "developerCredits" "$cv"; then
              if grep -E -q "developerCredits\s*\(" "$cv"; then
                PATCH="$PATCH
@ViewBuilder
func developerCredits() -> some View {
  HStack {
    Text(\"FOUGO Developer\").font(.caption).foregroundColor(.secondary)
  }
}
"
              else
                PATCH="$PATCH
@ViewBuilder
var developerCredits: some View {
  HStack {
    Text(\"FOUGO Developer\").font(.caption).foregroundColor(.secondary)
  }
}
"
              fi
            fi

            if [ -n "$PATCH" ]; then
              printf "\n\nimport SwiftUI\n$PATCH\n" >> "$cv"
              echo "Appended missing Swift helpers to $cv"
            else
              echo "No Swift helper patches needed for $cv"
            fi
          done

      - name: Provide Missing Private Kernel Headers
        run: |
          echo "Providing private sys/fileport.h header for kexploit_opa334..."
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          sudo mkdir -p "$SDK_PATH/usr/include/sys"
          printf '#ifndef _SYS_FILEPORT_H_\n#define _SYS_FILEPORT_H_\n#include <sys/cdefs.h>\n#include <sys/types.h>\n#include <mach/mach_types.h>\n#define FILEPORT_NULL 0\ntypedef mach_port_t fileport_t;\n__BEGIN_DECLS\nint fileport_makeport(int fd, fileport_t *port);\nint fileport_makefd(fileport_t port);\n__END_DECLS\n#endif\n' | sudo tee "$SDK_PATH/usr/include/sys/fileport.h" > /dev/null
          
          mkdir -p include/sys
          printf '#ifndef _SYS_FILEPORT_H_\n#define _SYS_FILEPORT_H_\n#include <sys/cdefs.h>\n#include <sys/types.h>\n#include <mach/mach_types.h>\n#define FILEPORT_NULL 0\ntypedef mach_port_t fileport_t;\n__BEGIN_DECLS\nint fileport_makeport(int fd, fileport_t *port);\nint fileport_makefd(fileport_t port);\n__END_DECLS\n#endif\n' > include/sys/fileport.h
          find . -type d -name "kexploit" | while read -r kdir; do
            mkdir -p "$kdir/sys"
            cp include/sys/fileport.h "$kdir/sys/fileport.h"
          done

      - name: Select Xcode Version
        run: |
          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_15.4.app/Contents/Developer"
          elif [ -d "/Applications/Xcode.app" ]; then
            sudo xcode-select -s "/Applications/Xcode.app/Contents/Developer"
          fi
          xcodebuild -version

      - name: Compile with xcodebuild
        run: |
          set -o pipefail
          BUILD_SUCCESS=0
          xcodebuild clean build \
            -project "$PROJECT_PATH" \
            -scheme "FOUGO" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES 2>&1 | tee xcodebuild.log || BUILD_SUCCESS=$?

          if [ $BUILD_SUCCESS -ne 0 ]; then
            echo "=========================================="
            echo "::error::CRITICAL COMPILATION ERRORS FOUND:"
            grep -E "error:|fatal error:|\*\* BUILD FAILED \*\*" xcodebuild.log || true
            echo "=========================================="
            exit $BUILD_SUCCESS
          fi

      - name: Package .app into .ipa
        run: |
          APP_PATH=$(find build/Build/Products -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::No .app found in build products!"
            find build -maxdepth 4 || true
            exit 1
          fi
          echo "Packaging application bundle: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -vr "FOUGO.ipa" Payload
          rm -rf Payload
          echo "Successfully generated IPA package:"
          ls -lh "FOUGO.ipa"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FOUGO-Unsigned-IPA
          path: FOUGO.ipa
          if-no-files-found: error
          retention-days: 14
