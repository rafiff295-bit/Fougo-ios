name: Build FOUGO IPA

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'Optional: Direct download URL to source .zip'
        required: false
        default: ''
        type: string
      build_configuration:
        description: 'Build Configuration'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug

jobs:
  build-ipa:
    name: Build Unsigned iOS IPA
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ----------------------------------------------------
      # 1. SAFELY UNZIP (HANDLES SPACES IN ZIP NAME)
      # ----------------------------------------------------
      - name: Auto-Extract Zip Files
        run: |
          echo "Scanning for zip files..."

          ZIP_URL="${{ github.event.inputs.zip_url }}"
          if [ -n "$ZIP_URL" ]; then
            echo "Downloading ZIP from: $ZIP_URL"
            curl -L -o "source_download.zip" "$ZIP_URL"
          fi

          find . -maxdepth 2 -name "*.zip" -type f | while IFS= read -r zipfile; do
            if [ -n "$zipfile" ]; then
              echo "==> Unzipping: $zipfile"
              unzip -q -o "$zipfile"
            fi
          done

      # ----------------------------------------------------
      # 2. LOCATE XCODE PROJECT
      # ----------------------------------------------------
      - name: Locate Xcode Project
        id: find-project
        run: |
          PROJ_PATH=$(find . -name "ThreeOneOSFive.xcodeproj" -type d | head -n 1)

          if [ -z "$PROJ_PATH" ]; then
            PROJ_PATH=$(find . -name "*.xcodeproj" -type d | head -n 1)
          fi

          if [ -z "$PROJ_PATH" ]; then
            echo "::error::Could not find any .xcodeproj directory!"
            find . -maxdepth 3
            exit 1
          fi

          echo "Found Xcode project at: $PROJ_PATH"
          echo "PROJECT_PATH=$PROJ_PATH" >> $GITHUB_ENV
          echo "PROJECT_DIR=$(dirname "$PROJ_PATH")" >> $GITHUB_ENV

      # ----------------------------------------------------
      # 3. AUTO-REPAIR LINE 353 IN PROJECT.PBXPROJ
      # ----------------------------------------------------
      - name: Repair and Validate Xcode Project Syntax
        run: |
          PBX_FILE="$PROJECT_PATH/project.pbxproj"
          echo "Inspecting $PBX_FILE for syntax errors..."

          if [ ! -f "$PBX_FILE" ]; then
            echo "::error::$PBX_FILE not found!"
            exit 1
          fi

          echo "=== Lines 340 to 365 of project.pbxproj ==="
          sed -n '340,365p' "$PBX_FILE" || true
          echo "============================================"

          python3 - << 'EOF' "$PBX_FILE"
          import sys

          pbx_path = sys.argv[1]
          with open(pbx_path, 'r', encoding='utf-8', errors='ignore') as f:
              lines = f.readlines()

          modified = False
          new_lines = []
          for i, line in enumerate(lines):
              s = line.strip()
              
              # 1. Strip git merge conflict markers
              if s.startswith(('<<<<<<<', '=======', '>>>>>>>')):
                  print(f"Removing conflict marker at line {i+1}: {s}")
                  modified = True
                  continue

              # 2. Fix unquoted paths containing spaces or parentheses (e.g. FOUGO File (9).3105;)
              if '=' in s and ';' in s and not s.startswith(('//', '/*')):
                  before, after = line.split('=', 1)
                  val, rest = after.rsplit(';', 1)
                  v = val.strip()
                  comment = ''
                  if '/*' in v and v.endswith('*/'):
                      c_idx = v.find('/*')
                      comment = ' ' + v[c_idx:]
                      v = v[:c_idx].strip()
                  
                  if (' ' in v or '(' in v or ')' in v) and not (v.startswith('"') and v.endswith('"')):
                      line = f"{before}= \"{v}\"{comment};{rest}"
                      print(f"Auto-quoting value at line {i+1}: {s} -> {line.strip()}")
                      modified = True

              # 3. Fix missing semicolon on assignments
              elif '=' in s and not s.startswith(('//', '/*')) and not s.endswith((';', '{', '(', ',')):
                  indent = line[:len(line) - len(line.lstrip())]
                  comment = ''
                  val_part = s
                  if '/*' in s and s.endswith('*/'):
                      c_idx = s.find('/*')
                      comment = ' ' + s[c_idx:]
                      val_part = s[:c_idx].strip()
                  line = f"{indent}{val_part};{comment}\n"
                  print(f"Auto-fixing missing semicolon at line {i+1}: {s} -> {line.strip()}")
                  modified = True

              # 4. Fix missing semicolon on closing brace '}' -> '};'
              elif s == '}' and i < len(lines) - 2:
                  indent = line[:len(line) - len(line.lstrip())]
                  line = f"{indent}}};\n"
                  print(f"Auto-fixing closing brace at line {i+1}: '}}' -> '}};'")
                  modified = True

              new_lines.append(line)

          if modified:
              with open(pbx_path, 'w', encoding='utf-8') as f:
                  f.writelines(new_lines)
              print("Successfully auto-repaired project.pbxproj syntax!")
          else:
              print("No syntax anomalies detected.")
          EOF

          echo "Validating plist with macOS plutil..."
          plutil -lint "$PBX_FILE" || true

      # ----------------------------------------------------
      # 4. SELECT XCODE & VERIFY SCHEME
      # ----------------------------------------------------
      - name: Select Xcode 15.4
        run: |
          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_15.4.app/Contents/Developer"
          elif [ -d "/Applications/Xcode.app" ]; then
            sudo xcode-select -s "/Applications/Xcode.app/Contents/Developer"
          fi
          xcodebuild -version

      - name: Verify Scheme & Project
        run: |
          xcodebuild -list -project "$PROJECT_PATH"

      # ----------------------------------------------------
      # 5. COMPILE APPLICATION
      # ----------------------------------------------------
      - name: Compile Application with xcodebuild
        run: |
          BUILD_CONFIG="${{ github.event.inputs.build_configuration || 'Release' }}"
          echo "Compiling scheme FOUGO using $PROJECT_PATH in $BUILD_CONFIG mode..."

          xcodebuild clean build \
            -project "$PROJECT_PATH" \
            -scheme "FOUGO" \
            -configuration "$BUILD_CONFIG" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      # ----------------------------------------------------
      # 6. PACKAGE INTO IPA & UPLOAD
      # ----------------------------------------------------
      - name: Package .app into .ipa
        run: |
          echo "Searching for compiled .app bundle..."
          APP_PATH=$(find build/Build/Products -name "*.app" -type d | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "::error::No .app bundle found in build products!"
            find build -maxdepth 5 || true
            exit 1
          fi

          echo "Found application bundle at: $APP_PATH"

          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -vr FOUGO.ipa Payload
          rm -rf Payload

          echo "Generated IPA successfully:"
          ls -lh FOUGO.ipa

      - name: Upload IPA as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FOUGO-Unsigned-IPA
          path: FOUGO.ipa
          if-no-files-found: error
          retention-days: 14
