name: Build FOUGO IPA

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build Unsigned iOS IPA
    runs-on: macos-14

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ----------------------------------------------------
      # 1. EXTRACT ZIP
      # ----------------------------------------------------
      - name: Extract Zip Files
        run: |
          find . -maxdepth 2 -name "*.zip" -type f | while IFS= read -r f; do
            echo "Unzipping: $f"
            unzip -q -o "$f"
          done

      # ----------------------------------------------------
      # 2. LOCATE XCODE PROJECT
      # ----------------------------------------------------
      - name: Locate Project & Scheme
        run: |
          PROJ_PATH=$(find . -name "ThreeOneOSFive.xcodeproj" -type d | head -n 1)
          [ -z "$PROJ_PATH" ] && PROJ_PATH=$(find . -name "*.xcodeproj" -type d | head -n 1)
          if [ -z "$PROJ_PATH" ]; then
            echo "::error::No .xcodeproj found!"
            exit 1
          fi
          echo "PROJECT_PATH=$PROJ_PATH" >> $GITHUB_ENV

      # ----------------------------------------------------
      # 3. FIX PROJECT SYNTAX & UNQUOTED NAMES
      # ----------------------------------------------------
      - name: Fix Project Syntax & Missing Quotes
        run: |
          PBX="$PROJECT_PATH/project.pbxproj"
          echo "Repairing syntax in $PBX..."
          python3 -c "import re, sys; p=sys.argv[1]; s=open(p, encoding='utf-8', errors='ignore').read(); open(p,'w', encoding='utf-8').write(re.sub(r'(\b\w+\s*=\s*)([^\";{}\n]+?)(\s*;)', lambda m: f'{m.group(1)}\"{m.group(2).strip()}\"{m.group(3)}' if (' ' in m.group(2) or '(' in m.group(2)) and not m.group(2).strip().startswith('\"') else m.group(0), s))" "$PBX"
          plutil -lint "$PBX" || true

      # ----------------------------------------------------
      # 4. SYNC PATCH RESOURCES
      # ----------------------------------------------------
      - name: Sync Patch Resource Files
        run: |
          find . -type d -name "Patches" | while read -r pdir; do
            echo "Syncing patch assets in $pdir..."
            for f in "$pdir"/"FOUGO File "*; do
              if [ -f "$f" ]; then
                cp -f "$f" "${f/FOUGO File/FOUGO EXTERNAL File}"
              fi
            done
          done

      # ----------------------------------------------------
      # 5. FIX APP ICON DIMENSIONS
      # ----------------------------------------------------
      - name: Fix AppIcon Dimensions to 1024x1024
        run: |
          find . -path "*/AppIcon.appiconset/*.png" -exec sips -z 1024 1024 {} + || true

      # ----------------------------------------------------
      # 6. INJECT ALL MISSING SWIFT HELPERS
      # ----------------------------------------------------
      - name: Patch Missing Helpers in ContentView
        run: |
          find . -name "ContentView.swift" | while read -r cv; do
            echo "Patching missing helpers into $cv..."
            printf '\n\nimport SwiftUI\n\n@ViewBuilder\nvar developerCredits: some View {\n  HStack {\n    Text("FOUGO Developer").font(.caption).foregroundColor(.secondary)\n  }\n}\n\n@ViewBuilder\nfunc developerCredits() -> some View {\n  developerCredits\n}\n\n@ViewBuilder\nfunc statusRow(icon: String, title: String, value: String, color: Color) -> some View {\n  HStack {\n    Label(title, systemImage: icon).font(.subheadline)\n    Spacer()\n    Text(value).font(.caption).fontWeight(.bold).foregroundColor(color)\n  }\n}\n\n@ViewBuilder\nfunc panelTitle(_ title: String, icon: String) -> some View {\n  HStack(spacing: 6) {\n    Image(systemName: icon).font(.system(size: 13, weight: .semibold))\n    Text(title).font(.system(size: 12, weight: .bold)).foregroundColor(.secondary)\n  }\n}\n' >> "$cv"
            echo "Successfully patched $cv"
          done

      # ----------------------------------------------------
      # 7. SELECT XCODE VERSION
      # ----------------------------------------------------
      - name: Select Xcode Version
        run: |
          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_15.4.app/Contents/Developer"
          fi
          xcodebuild -version

      # ----------------------------------------------------
      # 8. COMPILE WITH XCODEBUILD
      # ----------------------------------------------------
      - name: Compile with xcodebuild
        run: |
          set -o pipefail
          BUILD_SUCCESS=0
          xcodebuild clean build \
            -project "$PROJECT_PATH" \
            -scheme "FOUGO" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES 2>&1 | tee xcodebuild.log || BUILD_SUCCESS=$?

          if [ $BUILD_SUCCESS -ne 0 ]; then
            echo "=========================================="
            echo "::error::COMPILATION FAILED! EXACT ERRORS:"
            grep -E "error:|fatal error:|\*\* BUILD FAILED \*\*" xcodebuild.log || true
            echo "=========================================="
            exit $BUILD_SUCCESS
          fi

      # ----------------------------------------------------
      # 9. PACKAGE .app INTO .ipa
      # ----------------------------------------------------
      - name: Package .app into .ipa
        run: |
          APP_PATH=$(find build/Build/Products -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::No .app found!"
            exit 1
          fi
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -vr FOUGO.ipa Payload
          rm -rf Payload
          ls -lh FOUGO.ipa

      # ----------------------------------------------------
      # 10. UPLOAD ARTIFACT
      # ----------------------------------------------------
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FOUGO-Unsigned-IPA
          path: FOUGO.ipa
          if-no-files-found: error
          retention-days: 14
