name: Build FOUGO IPA

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build Unsigned iOS IPA
    runs-on: macos-14

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Extract Zip Files
        run: |
          find . -maxdepth 2 -name "*.zip" -type f | while IFS= read -r f; do
            echo "Unzipping: $f"
            unzip -q -o "$f"
          done

      - name: Locate Project & Scheme
        run: |
          PROJ_PATH=$(find . -name "ThreeOneOSFive.xcodeproj" -type d | head -n 1)
          [ -z "$PROJ_PATH" ] && PROJ_PATH=$(find . -name "*.xcodeproj" -type d | head -n 1)
          if [ -z "$PROJ_PATH" ]; then
            echo "::error::No .xcodeproj found!"
            exit 1
          fi
          echo "PROJECT_PATH=$PROJ_PATH" >> $GITHUB_ENV

      - name: Fix Project Syntax & Missing Quotes
        run: |
          PBX="$PROJECT_PATH/project.pbxproj"
          echo "Repairing syntax in $PBX..."
          python3 -c "import re, sys; p=sys.argv[1]; s=open(p, encoding='utf-8', errors='ignore').read(); open(p,'w', encoding='utf-8').write(re.sub(r'(\b\w+\s*=\s*)([^\";{}\n]+?)(\s*;)', lambda m: f'{m.group(1)}\"{m.group(2).strip()}\"{m.group(3)}' if (' ' in m.group(2) or '(' in m.group(2)) and not m.group(2).strip().startswith('\"') else m.group(0), s))" "$PBX"
          plutil -lint "$PBX" || true

      - name: Sync Patch Resource Files
        run: |
          find . -type d -name "Patches" | while read -r pdir; do
            echo "Syncing patch assets in $pdir..."
            for f in "$pdir"/"FOUGO File "*; do
              if [ -f "$f" ]; then
                cp -f "$f" "${f/FOUGO File/FOUGO EXTERNAL File}"
              fi
            done
          done

      - name: Fix AppIcon Dimensions to 1024x1024
        run: |
          find . -path "*/AppIcon.appiconset/*.png" -exec sips -z 1024 1024 {} + || true

      - name: Select Xcode Version
        run: |
          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_15.4.app/Contents/Developer"
          fi
          xcodebuild -version

      - name: Compile with xcodebuild
        run: |
          xcodebuild clean build \
            -project "$PROJECT_PATH" \
            -scheme "FOUGO" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package .app into .ipa
        run: |
          APP_PATH=$(find build/Build/Products -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::No .app found!"
            exit 1
          fi
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -vr FOUGO.ipa Payload
          rm -rf Payload
          ls -lh FOUGO.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FOUGO-Unsigned-IPA
          path: FOUGO.ipa
          if-no-files-found: error
          retention-days: 14
