name: Build FOUGO IPA

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'Optional: Direct download URL to source .zip'
        required: false
        default: ''
        type: string
      build_configuration:
        description: 'Build Configuration'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug

jobs:
  build-ipa:
    name: Build Unsigned iOS IPA
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ----------------------------------------------------
      # SAFELY EXTRACT ZIP (HANDLES SPACES IN FILENAMES)
      # ----------------------------------------------------
      - name: Auto-Extract Zip Files
        run: |
          echo "Scanning for zip files..."

          # 1. Download if URL was provided
          ZIP_URL="${{ github.event.inputs.zip_url }}"
          if [ -n "$ZIP_URL" ]; then
            echo "Downloading ZIP from: $ZIP_URL"
            curl -L -o "source_download.zip" "$ZIP_URL"
          fi

          # 2. Extract all .zip files safely (handling spaces like 'fougo vip iOS.zip')
          find . -maxdepth 2 -name "*.zip" -type f | while IFS= read -r zipfile; do
            if [ -n "$zipfile" ]; then
              echo "==> Unzipping: $zipfile"
              unzip -q -o "$zipfile"
            fi
          done

          echo "Extraction complete. Current directory contents:"
          ls -la

      # ----------------------------------------------------
      # LOCATE XCODE PROJECT
      # ----------------------------------------------------
      - name: Locate Xcode Project
        id: find-project
        run: |
          PROJ_PATH=$(find . -name "ThreeOneOSFive.xcodeproj" -type d | head -n 1)

          if [ -z "$PROJ_PATH" ]; then
            PROJ_PATH=$(find . -name "*.xcodeproj" -type d | head -n 1)
          fi

          if [ -z "$PROJ_PATH" ]; then
            echo "::error::Could not find any .xcodeproj directory!"
            find . -maxdepth 3
            exit 1
          fi

          echo "Found Xcode project at: $PROJ_PATH"
          echo "PROJECT_PATH=$PROJ_PATH" >> $GITHUB_ENV
          echo "PROJECT_DIR=$(dirname "$PROJ_PATH")" >> $GITHUB_ENV

      - name: Select Xcode 15.4
        run: |
          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_15.4.app/Contents/Developer"
          elif [ -d "/Applications/Xcode.app" ]; then
            sudo xcode-select -s "/Applications/Xcode.app/Contents/Developer"
          fi
          xcodebuild -version

      - name: Verify Scheme & Project
        run: |
          xcodebuild -list -project "$PROJECT_PATH"

      - name: Compile Application with xcodebuild
        run: |
          BUILD_CONFIG="${{ github.event.inputs.build_configuration || 'Release' }}"
          echo "Compiling scheme FOUGO using $PROJECT_PATH in $BUILD_CONFIG mode..."

          xcodebuild clean build \
            -project "$PROJECT_PATH" \
            -scheme "FOUGO" \
            -configuration "$BUILD_CONFIG" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package .app into .ipa
        run: |
          echo "Searching for compiled .app bundle..."
          APP_PATH=$(find build/Build/Products -name "*.app" -type d | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "::error::No .app bundle found in build products!"
            find build -maxdepth 5 || true
            exit 1
          fi

          echo "Found application bundle at: $APP_PATH"

          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -vr FOUGO.ipa Payload
          rm -rf Payload

          echo "Generated IPA successfully:"
          ls -lh FOUGO.ipa

      - name: Upload IPA as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FOUGO-Unsigned-IPA
          path: FOUGO.ipa
          if-no-files-found: error
          retention-days: 14
